/* ---------- Rendering ---------- */
const TYPE={mc:'Choose',tf:'True or false',fill:'Fill in',label:'Label the picture',order:'Put in order',open:'Open question'};

function renderItem(it,n,record){
  const c=el('div','card');
  c.append(el('div','qn',`${n}. ${TYPE[it.t]}`));
  const fb=el('div','fb');
  const q=t=>c.append(el('div','q',t));
  const done=(ok,msg)=>{fb.className='fb '+(ok?'okm':'badm');fb.innerHTML=(ok?'✅ ':'❌ ')+(msg||(ok?pick(PRAISE):'Not quite.'));record(ok)};

  if(it.t==='mc'||it.t==='tf'){
    const opts=it.t==='tf'?['True','False']:(it.keep?it.opts:shuffle(it.opts));
    const ans=it.t==='tf'?(it.a?'True':'False'):it.opts[it.a];
    q(it.q);const box=el('div','opts');
    opts.forEach(o=>{const b=el('button','opt');b.textContent=o;b.onclick=()=>{
      [...box.children].forEach(x=>{x.disabled=true;if(x.textContent===ans)x.classList.add('ok')});
      const ok=o===ans;if(!ok)b.classList.add('bad');
      done(ok,(ok?pick(PRAISE)+' ':'The answer is: <b>'+ans+'</b>. ')+(it.ex||''));
    };box.append(b)});
    c.append(box);
  }

  if(it.t==='fill'){
    q(it.prompt||'Fill in the gaps.');
    const p=el('div','fill');const ins=[];let last=null;
    it.q.split('\n').forEach((line,li)=>{
      if(li)p.append(document.createElement('br'));
      const parts=line.split('___');
      parts.forEach((t,i)=>{p.append(document.createTextNode(t));if(i<parts.length-1){const x=document.createElement('input');x.setAttribute('autocapitalize','off');x.autocomplete='off';x.spellcheck=false;x.onfocus=()=>{last=x};ins.push(x);p.append(x)}});
    });
    c.append(p);
    if(it.bank){const bk=el('div','bank');shuffle(it.bank).forEach(w=>{const ch=el('button','chip');ch.textContent=w;ch.onclick=()=>{
      const t=(last&&!last.value&&!last.disabled)?last:ins.find(x=>!x.value&&!x.disabled);
      if(t){t.value=w;last=ins.find(x=>!x.value)||null}
    };bk.append(ch)});c.append(bk)}
    const chk=el('button','btn','Check');
    chk.onclick=()=>{
      let all=true;const pool=it.set?it.set.slice():null;
      ins.forEach((x,i)=>{
        const v=norm(x.value);let ok,right;
        if(it.setFrom!=null&&i>=it.setFrom){const k=pool.findIndex(s=>norm(s)===v);ok=v&&k>=0;if(ok)pool.splice(k,1);right=it.setHint}
        else{ok=it.a[i].some(s=>norm(s)===v);right=it.a[i][0]}
        x.disabled=true;x.classList.add(ok?'ok':'bad');
        if(!ok){all=false;x.insertAdjacentHTML('afterend',`<span class="fix">→ ${right}</span>`)}
      });
      chk.remove();done(all,all?pick(PRAISE)+(it.ex?' '+it.ex:''):'Look at the green words. '+(it.ex||''));
    };
    c.append(row(chk));
  }

  if(it.t==='label'){
    q(it.q);c.insertAdjacentHTML('beforeend',SVG[it.svg]);
    const sels=it.a.map((ans,i)=>{
      const r=el('div','lrow');r.append(el('span','badge',String(i+1)));
      const s=document.createElement('select');s.setAttribute('aria-label','Label '+(i+1));
      s.innerHTML='<option value="">choose…</option>'+shuffle(it.a).map(o=>`<option>${o}</option>`).join('');
      r.append(s);c.append(r);return s});
    const chk=el('button','btn','Check');
    chk.onclick=()=>{let all=true;sels.forEach((s,i)=>{const ok=s.value===it.a[i];s.disabled=true;s.classList.add(ok?'ok':'bad');if(!ok){all=false;s.insertAdjacentHTML('afterend',`<span class="fix">→ ${it.a[i]}</span>`)}});chk.remove();done(all,all?pick(PRAISE)+(it.ex?' '+it.ex:''):(it.ex||'Look at the green labels.'))};
    c.append(row(chk));
  }

  if(it.t==='order'){
    q(it.q);const seq=el('div','seq'),pool=el('div','opts'),picked=[];
    const draw=()=>{seq.innerHTML=picked.length?picked.map((s,i)=>`<div><b>${i+1}.</b> ${s}</div>`).join(''):'<span class="hint">Tap the steps below in the right order.</span>'};
    shuffle(it.a).forEach(s=>{const b=el('button','opt');b.textContent=s;b.onclick=()=>{picked.push(s);b.style.display='none';draw()};pool.append(b)});
    const undo=el('button','btn soft','↶ Undo');undo.onclick=()=>{const s=picked.pop();if(s){[...pool.children].find(b=>b.textContent===s).style.display='';draw()}};
    const chk=el('button','btn','Check');
    chk.onclick=()=>{
      if(picked.length<it.a.length){fb.className='fb badm';fb.textContent='Put all the steps in order first.';return}
      const ok=picked.every((s,i)=>s===it.a[i]);
      seq.innerHTML=picked.map((s,i)=>`<div class="${s===it.a[i]?'ok':'bad'}"><b>${i+1}.</b> ${s}</div>`).join('');
      undo.remove();chk.remove();
      done(ok,ok?pick(PRAISE):'The right order is:<br>'+it.a.map((s,i)=>`${i+1}. ${s}`).join('<br>'));
    };
    draw();c.append(seq,pool,row(undo,chk));
  }

  if(it.t==='open'){
    q(it.q);const ta=document.createElement('textarea');ta.placeholder='Write your answer in English…';c.append(ta);
    const show=el('button','btn','Show the model answer');c.append(row(show));
    show.onclick=()=>{
      show.parentNode.remove();
      c.insertBefore(el('div','model','<b>Model answer</b><br>'+it.model+(it.keys?'<br><br><b>Key ideas:</b> '+it.keys.join('; '):'')),fb);
      const y=el('button','btn','✓ I had the key ideas'),nn=el('button','btn soft','✗ Not yet');const r2=row(y,nn);c.insertBefore(r2,fb);
      y.onclick=()=>{r2.remove();done(true,'Great job!')};
      nn.onclick=()=>{r2.remove();done(false,'Read the model answer again and try to say it out loud.')};
    };
  }
  c.append(fb);return c;
}

function practice(m,intro,items,restart){
  m.innerHTML='';m.append(el('p','intro',intro));
  const res={};const bars=[];
  const mkBar=()=>{
    const b=el('div','scorebar',`<div class="sc"></div><div class="row"><button class="btn soft rs">↻ Start again</button><button class="btn rt">Retry mistakes</button></div>`);
    const upd=()=>{
      const v=Object.values(res),ok=v.filter(Boolean).length,wrong=v.length-ok,left=items.length-v.length;
      b.querySelector('.sc').innerHTML=`✅ <b>${ok}</b> &nbsp; ❌ <b>${wrong}</b> &nbsp; ${left?left+' to do':(wrong?'Finished!':'All correct! 🎉')}`;
      b.querySelector('.rt').disabled=!wrong;
    };
    b.querySelector('.rs').onclick=()=>{restart();scrollTo(0,0)};
    b.querySelector('.rt').onclick=()=>{const w=items.filter(it=>res[it.uid]===false);practice(m,'Let’s try your mistakes again 💪',w,restart);scrollTo(0,0)};
    bars.push(upd);upd();return b;
  };
  m.append(mkBar());
  items.forEach((it,i)=>m.append(renderItem(it,i+1,ok=>{res[it.uid]=ok;bars.forEach(f=>f())})));
  m.append(mkBar());
}

function renderFlash(m){
  let dir='en',deck=shuffle(VOCAB),known=0,flipped=false;
  m.innerHTML=`<p class="intro">Vocabulary cards. Tap the card to see the translation.</p>
  <div class="row" style="margin:0 0 12px"><button class="btn soft" id="dir"></button><button class="btn soft" id="fr">↻ Shuffle</button></div>
  <div class="card flash" id="fc" role="button" tabindex="0"></div>
  <div class="row"><button class="btn soft" id="ag">↻ Again later</button><button class="btn" id="kn">✓ I know it</button></div>
  <p class="intro" id="fcount" style="margin-top:12px"></p>`;
  const draw=()=>{
    $('#dir').textContent=dir==='en'?'English → Italiano':'Italiano → English';
    if(!deck.length){$('#fc').innerHTML='🎉 All done!<small>Tap Shuffle to start again</small>';$('#fcount').textContent='';return}
    const w=deck[0],front=dir==='en'?w.en:w.it,back=dir==='en'?w.it:w.en;
    $('#fc').innerHTML=flipped?`<div>${back}<small>${w.hint||'&nbsp;'}</small></div>`:`<div>${front}<small>tap to flip</small></div>`;
    $('#fcount').textContent=`${deck.length} cards left, ${known} known`;
  };
  const flip=()=>{flipped=!flipped;draw()};
  $('#fc').onclick=flip;$('#fc').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  $('#kn').onclick=()=>{if(!deck.length)return;deck.shift();known++;flipped=false;draw()};
  $('#ag').onclick=()=>{if(!deck.length)return;deck.push(deck.shift());flipped=false;draw()};
  $('#dir').onclick=()=>{dir=dir==='en'?'it':'en';flipped=false;draw()};
  $('#fr').onclick=()=>{deck=shuffle(VOCAB);known=0;flipped=false;draw()};
  draw();
}

function renderMix(m){
  const all=SECTIONS.flatMap(s=>s.items.map((it,i)=>({...it,uid:s.id+i}))).filter(it=>it.t!=='open');
  practice(m,'Mixed test: 12 random questions from all the topics. 🎯',shuffle(all).slice(0,12),()=>renderMix(m));
}

const TABS=[...SECTIONS.map(s=>({id:s.id,label:s.tab})),{id:'mix',label:'🎯 Mixed test'},{id:'flash',label:'🃏 Vocabulary'}];
function go(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.id===id));
  const m=$('#main');
  if(id==='flash')return renderFlash(m);
  if(id==='mix')return renderMix(m);
  const s=SECTIONS.find(x=>x.id===id);
  practice(m,s.intro,s.items.map((it,i)=>({...it,uid:id+i})),()=>go(id));
}
TABS.forEach(t=>{const b=el('button','tab');b.textContent=t.label;b.dataset.id=t.id;b.onclick=()=>{go(t.id);scrollTo(0,0)};$('#tabs').append(b)});
go('dis');
